<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Result Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="box">
    <p class="app-title">Student Result Calculator</p>
    <label for="bangla">Enter Marks for Bangla(0-100):</label>
    <input type="number" id="bangla" min="0" max="100">
    <label for="english">Enter Marks for English(0-100):</label>
    <input type="number" id="english" min="0" max="100">
    <label for="math">Enter Marks for Math(0-100):</label>
    <input type="number" id="math" min="0" max="100">
    <button id="calculateBtn">Calculate</button>
    <div>
      <p id="total">Total:</p>
      <p id="average">Average:</p>
      <p id="grade">Grade:</p>
    </div>
  </div>
</body>
</html>
