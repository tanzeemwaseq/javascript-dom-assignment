<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Counter App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="box">
    <h1>Counter</h1>
    <div>
      <button id="decrement">-</button>
      <span id="counter">0</span>
      <button id="increment">+</button>
    </div>
    <div>
      <button id="reset">Reset</button>
    </div>
  </div>
</body>

</html>
